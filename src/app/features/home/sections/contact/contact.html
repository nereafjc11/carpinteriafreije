
<section class="contact" id="contacto">

  <div class="contact-container">

    <!-- INFORMACIÓN -->
    <div class="contact-info">

      <span class="eyebrow">CONTACTO</span>

      <h2>
        ¿Tienes un proyecto<br>
        en mente?
      </h2>

      <p class="contact-description">
        Cuéntame tu idea y te preparo un presupuesto
        sin compromiso.
      </p>

      <div class="contact-details">

        <a href="tel:+34600000000" class="contact-item">
          <span class="contact-icon">☎</span>
          <span>
            <strong>Teléfono</strong>
            <small>Añadir teléfono real</small>
          </span>
        </a>

        <a href="mailto:correo@ejemplo.es" class="contact-item">
          <span class="contact-icon">✉</span>
          <span>
            <strong>Correo electrónico</strong>
            <small>Añadir correo real</small>
          </span>
        </a>

        <a
          href="https://wa.me/34600000000"
          target="_blank"
          rel="noopener noreferrer"
          class="contact-item"
        >
          <span class="contact-icon">◉</span>
          <span>
            <strong>WhatsApp</strong>
            <small>Escríbeme directamente</small>
          </span>
        </a>

      </div>

    </div>

    <!-- FORMULARIO -->
    <div class="contact-form-container">

      <form class="contact-form">

        <div class="form-row">

          <div class="form-group">
            <label for="name">Nombre *</label>
            <input
              id="name"
              name="name"
              type="text"
              placeholder="Tu nombre"
              required
            >
          </div>

          <div class="form-group">
            <label for="phone">Teléfono</label>
            <input
              id="phone"
              name="phone"
              type="tel"
              placeholder="Tu teléfono"
            >
          </div>

        </div>

        <div class="form-group">
          <label for="email">Correo electrónico *</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="tu@email.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="subject">Asunto</label>
          <select id="subject" name="subject">
            <option value="">Selecciona un servicio</option>
            <option value="Escaleras">Escaleras</option>
            <option value="Puertas">Puertas</option>
            <option value="Tejados">Tejados y estructuras</option>
            <option value="Suelos">Suelos</option>
            <option value="Barandillas">Barandillas y cerramientos</option>
            <option value="Mobiliario">Mobiliario a medida</option>
            <option value="Otro">Otro trabajo</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Cuéntame tu proyecto *</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Describe qué trabajo necesitas..."
            required
          ></textarea>
        </div>

        <button type="submit" class="submit-button">
          <span>Enviar mensaje</span>
          <span>→</span>
        </button>

        <p class="form-privacy">
          Al enviar este formulario aceptas nuestra
          política de privacidad.
        </p>

      </form>

    </div>

  </div>

</section>
